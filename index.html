<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search-In: The Road to 50</title>
    <!-- Source Sans Pro Regular -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Source Sans Pro", sans-serif;
            overflow: hidden;
            background: #000;
        }
        /* =========================
           SLIDESHOW
        ========================= */
        .slideshow {
            position: fixed;
            inset: 0;
            background: #000;
        }
        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .slide.active {
            opacity: 1;
        }
        /* =========================
           DARK OVERLAY
        ========================= */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        /* =========================
           SEARCH-IN LOGO
        ========================= */
        .overlay img {
            width: 100px;
            max-width: 80%;
            margin-bottom: 20px;
            filter:
                drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6));
        }
        /* =========================
           MAIN TITLE
        ========================= */
        .title {
            color: white;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.6);
        }
        /* =========================
           YEAR
        ========================= */
        .year {
            color: white;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 5px;
            margin-top: 12px;
            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.6);
        }
        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 768px) {
            .overlay img {
                width: 80px;
                margin-bottom: 18px;
            }
            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .year {
                font-size: 1rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- =========================
         PHOTO SLIDESHOW
    ========================= -->
    <div
        class="slideshow"
        id="slideshow">
    </div>
    <!-- =========================
         CENTER CONTENT
    ========================= -->
    <div class="overlay">
        <img
            src="logo.png"
            alt="Search-In Logo"
        >
        <div class="title">
            THE ROAD TO 50
        </div>
        <div class="year">
            2028
        </div>
    </div>
    <script>
        /*
        ============================================
        SEARCH-IN ROAD TO 50
        AUTOMATIC PHOTO SLIDESHOW
        ============================================
        Any image inside the "images" folder will
        automatically be included.
        You can use any filenames you want.
        Example:
        images/
        ├── logo.png
        ├── IMG_1234.jpg
        ├── retreat-1978.jpeg
        ├── photo-from-2005.jpg
        ├── group-photo.webp
        └── anything-you-want.png
        The logo is excluded from the slideshow.
        Photos are randomized every time the website
        loads.
        ============================================
        */
        async function loadPhotos() {
            const slideshow =
                document.getElementById("slideshow");
            try {
                /* ----------------------------------
                   FIND GITHUB REPOSITORY
                ---------------------------------- */
                const hostname =
                    window.location.hostname;
                const pathname =
                    window.location.pathname;
                let owner;
                let repo;
                if (hostname.endsWith(".github.io")) {
                    owner =
                        hostname.replace(".github.io", "");
                    const pathParts =
                        pathname
                            .split("/")
                            .filter(
                                part => part.length > 0
                            );
                    repo = pathParts[0];
                }
                /* ----------------------------------
                   CHECK GITHUB REPOSITORY
                ---------------------------------- */
                if (!owner || !repo) {
                    console.error(
                        "Could not determine GitHub repository."
                    );
                    return;
                }
                /* ----------------------------------
                   GET FILES FROM IMAGES FOLDER
                ---------------------------------- */
                const apiURL =
                    `https://api.github.com/repos/${owner}/${repo}/contents/images`;
                const response =
                    await fetch(apiURL);
                if (!response.ok) {
                    throw new Error(
                        "Could not access the images folder."
                    );
                }
                const files =
                    await response.json();
                /* ----------------------------------
                   KEEP ONLY IMAGE FILES
                ---------------------------------- */
                let imageFiles =
                    files.filter(file => {
                        const name =
                            file.name.toLowerCase();
                        const isImage =
                            name.endsWith(".jpg") ||
                            name.endsWith(".jpeg") ||
                            name.endsWith(".png") ||
                            name.endsWith(".webp");
                        const isLogo =
                            name === "logo.png" ||
                            name === "logo.jpg" ||
                            name === "logo.jpeg" ||
                            name === "logo.webp";
                        return isImage && !isLogo;
                    });
                /* ----------------------------------
                   RANDOMIZE PHOTO ORDER
                ----------------------------------
                   Fisher-Yates shuffle
                ---------------------------------- */
                for (
                    let i = imageFiles.length - 1;
                    i > 0;
                    i--
                ) {
                    const j =
                        Math.floor(
                            Math.random() * (i + 1)
                        );
                    [
                        imageFiles[i],
                        imageFiles[j]
                    ] =
                    [
                        imageFiles[j],
                        imageFiles[i]
                    ];
                }
                /* ----------------------------------
                   CREATE SLIDES
                ---------------------------------- */
                imageFiles.forEach(file => {
                    const slide =
                        document.createElement("div");
                    slide.className =
                        "slide";
                    slide.style.backgroundImage =
                        `url("${file.download_url}")`;
                    slideshow.appendChild(slide);
                });
                /* ----------------------------------
                   START SLIDESHOW
                ---------------------------------- */
                const slides =
                    document.querySelectorAll(".slide");
                if (slides.length === 0) {
                    console.error(
                        "No photos found in images folder."
                    );
                    return;
                }
                let currentSlide = 0;
                /* Show first photo */
                slides[currentSlide]
                    .classList
                    .add("active");
                /*
                Change photo every 5 seconds.
                CSS handles the 2-second
                crossfade.
                */
                setInterval(() => {
                    slides[currentSlide]
                        .classList
                        .remove("active");
                    currentSlide =
                        (currentSlide + 1)
                        % slides.length;
                    slides[currentSlide]
                        .classList
                        .add("active");
                }, 5000);
                console.log(
                    `Loaded ${slides.length} photos.`
                );
            }
            catch (error) {
                console.error(
                    "Could not load slideshow photos:",
                    error
                );
            }
        }
        /* ----------------------------------
           START SLIDESHOW
        ---------------------------------- */
        loadPhotos();
    </script>
</body>
</html>
