
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search-In: The Road to 50</title>

    <!-- Source Sans Pro Regular -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans Pro", sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* SLIDESHOW */

        .slideshow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0;
            transition: opacity 2s ease-in-out;
            will-change: opacity;
        }

        .slide.active {
            opacity: 1;
        }

        /* CENTER OVERLAY */

        .overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.35);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            /* Keep branding above the photos */
            z-index: 10;
            pointer-events: none;
        }

        /* SEARCH-IN LOGO */

        .overlay img {
            width: 100px;
            max-width: 80%;
            margin-bottom: 20px;

            filter: drop-shadow(
                0 4px 15px rgba(0, 0, 0, 0.6)
            );
        }

        /* MAIN TITLE */

        .title {
            color: white;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 8px;

            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.6);
        }

        /* YEAR */

        .year {
            color: white;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 5px;
            margin-top: 12px;

            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.6);
        }

        /* MOBILE */

        @media (max-width: 768px) {
            .overlay img {
                width: 80px;
                margin-bottom: 18px;
            }

            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .year {
                font-size: 1rem;
                letter-spacing: 4px;
            }
        }

        /* Respect reduced-motion preferences */

        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- PHOTO SLIDESHOW -->

    <div class="slideshow" id="slideshow">
        <div class="slide" id="slideA"></div>
        <div class="slide" id="slideB"></div>
    </div>

    <!-- CENTER CONTENT -->

    <div class="overlay">
        <img src="logo.png" alt="Search-In Logo">

        <div class="title">
            THE ROAD TO 50
        </div>

        <div class="year">
            2028
        </div>
    </div>

    <script>
        /*
        ================================================
        SEARCH-IN: THE ROAD TO 50
        ================================================

        - Automatically finds photos in images/
        - No photo renaming required
        - Randomized photo order
        - Two-layer crossfade
        - Preloads each next photo before transitioning
        - Skips broken or unsupported images
        - Keeps the current photo visible during loading
        - Supports JPG, JPEG, PNG, and WEBP

        Required structure:

        index.html
        logo.png
        images/
            photo1.jpg
            photo2.jpeg
            old-photo.png
            anything.webp
        ================================================
        */

        async function loadPhotos() {
            const slideshow =
                document.getElementById("slideshow");

            const slideA =
                document.getElementById("slideA");

            const slideB =
                document.getElementById("slideB");

            try {
                /*
                STEP 1: DETERMINE REPOSITORY
                */

                const hostname =
                    window.location.hostname;

                const pathname =
                    window.location.pathname;

                let owner;
                let repo;

                if (hostname.endsWith(".github.io")) {
                    owner = hostname.replace(
                        ".github.io",
                        ""
                    );

                    const pathParts = pathname
                        .split("/")
                        .filter(Boolean);

                    repo = pathParts[0];
                }

                if (!owner || !repo) {
                    throw new Error(
                        "Could not determine GitHub repository. " +
                        "This script expects a GitHub Pages URL."
                    );
                }

                /*
                STEP 2: FETCH IMAGE LIST
                */

                const apiURL =
                    `https://api.github.com/repos/` +
                    `${owner}/${repo}/contents/images`;

                const response = await fetch(apiURL);

                if (!response.ok) {
                    throw new Error(
                        `GitHub API returned ${response.status}. ` +
                        "Check the repository name, images folder, " +
                        "and GitHub API rate limit."
                    );
                }

                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error(
                        "The images path did not return a file list."
                    );
                }

                /*
                STEP 3: FILTER PHOTOS
                */

                const supportedExtensions = [
                    ".jpg",
                    ".jpeg",
                    ".png",
                    ".webp"
                ];

                let imageFiles = files.filter(file => {
                    if (file.type !== "file") {
                        return false;
                    }

                    const name =
                        file.name.toLowerCase();

                    const isImage =
                        supportedExtensions.some(
                            ext => name.endsWith(ext)
                        );

                    const isLogo =
                        /^logo\.(jpg|jpeg|png|webp)$/i
                            .test(file.name);

                    return (
                        isImage &&
                        !isLogo &&
                        typeof file.download_url === "string"
                    );
                });

                if (imageFiles.length === 0) {
                    throw new Error(
                        "No supported photos found in images/."
                    );
                }

                /*
                STEP 4: RANDOMIZE PHOTO ORDER
                */

                for (
                    let i = imageFiles.length - 1;
                    i > 0;
                    i--
                ) {
                    const j = Math.floor(
                        Math.random() * (i + 1)
                    );

                    [
                        imageFiles[i],
                        imageFiles[j]
                    ] = [
                        imageFiles[j],
                        imageFiles[i]
                    ];
                }

                /*
                STEP 5: PRELOAD AND VERIFY PHOTOS

                A photo is only shown after the browser
                confirms that it has loaded and decoded.

                If a photo fails, it is skipped.
                */

                function preloadImage(url) {
                    return new Promise(resolve => {
                        const img = new Image();
                        let finished = false;

                        function finish(success) {
                            if (finished) return;
                            finished = true;

                            img.onload = null;
                            img.onerror = null;

                            resolve(success ? img : null);
                        }

                        img.onload = async () => {
                            try {
                                if (img.decode) {
                                    await img.decode();
                                }

                                finish(
                                    img.naturalWidth > 0 &&
                                    img.naturalHeight > 0
                                );
                            } catch {
                                // Some browsers can reject decode()
                                // even when the image is displayable.
                                finish(
                                    img.naturalWidth > 0 &&
                                    img.naturalHeight > 0
                                );
                            }
                        };

                        img.onerror = () => finish(false);

                        img.src = url;

                        // Handle images already available in cache.
                        if (img.complete && img.naturalWidth > 0) {
                            if (img.decode) {
                                img.decode()
                                    .then(() => finish(true))
                                    .catch(() => {
                                        finish(
                                            img.naturalWidth > 0
                                        );
                                    });
                            } else {
                                finish(true);
                            }
                        }
                    });
                }

                /*
                STEP 6: FIND THE FIRST WORKING PHOTO

                Do not display an empty slide while loading.
                */

                let firstImage = null;
                let currentIndex = -1;

                for (
                    let i = 0;
                    i < imageFiles.length;
                    i++
                ) {
                    const candidate =
                        imageFiles[i].download_url;

                    const loaded =
                        await preloadImage(candidate);

                    if (loaded) {
                        firstImage = candidate;
                        currentIndex = i;

                        console.log(
                            "First photo loaded:",
                            imageFiles[i].name
                        );

                        break;
                    }

                    console.warn(
                        "Skipping unreadable photo:",
                        imageFiles[i].name
                    );
                }

                if (!firstImage) {
                    throw new Error(
                        "None of the photos could be loaded. " +
                        "Check their file formats and URLs."
                    );
                }

                /*
                STEP 7: SHOW FIRST PHOTO
                */

                let activeSlide = slideA;
                let inactiveSlide = slideB;

                activeSlide.style.backgroundImage =
                    `url("${firstImage}")`;

                activeSlide.classList.add("active");

                /*
                STEP 8: SAFE CROSSFADE

                Keep the current photo visible until the
                next one has loaded successfully.

                Only one transition runs at a time.
                */

                const DISPLAY_TIME = 5000;
                const FADE_TIME = 2000;

                const wait = ms =>
                    new Promise(resolve =>
                        setTimeout(resolve, ms)
                    );

                async function nextPhoto() {
                    /*
                    Try each remaining photo in shuffled order.
                    A failed image never replaces the current one.
                    */

                    for (
                        let attempts = 0;
                        attempts < imageFiles.length;
                        attempts++
                    ) {
                        currentIndex =
                            (currentIndex + 1) %
                            imageFiles.length;

                        const file =
                            imageFiles[currentIndex];

                        const loaded =
                            await preloadImage(
                                file.download_url
                            );

                        if (!loaded) {
                            console.warn(
                                "Photo failed to load; skipping:",
                                file.name
                            );

                            continue;
                        }

                        /*
                        Prepare the hidden layer first.
                        */

                        inactiveSlide.style.backgroundImage =
                            `url("${file.download_url}")`;

                        /*
                        Force the browser to register the
                        hidden state before enabling the fade.
                        */

                        void inactiveSlide.offsetWidth;

                        inactiveSlide.classList.add("active");

                        /*
                        Wait for the crossfade to finish
                        before reusing the previous layer.
                        */

                        await wait(FADE_TIME + 100);

                        activeSlide.classList.remove("active");

                        /*
                        Swap layer references.
                        The newly visible image is now active.
                        */

                        const previousSlide = activeSlide;

                        activeSlide = inactiveSlide;
                        inactiveSlide = previousSlide;

                        console.log(
                            "Now displaying:",
                            file.name
                        );

                        return true;
                    }

                    console.error(
                        "No additional readable photos found. " +
                        "Keeping the last visible photo."
                    );

                    return false;
                }

                /*
                STEP 9: RUN SLIDESHOW

                A sequential loop prevents overlapping timers
                and competing transitions.
                */

                while (true) {
                    await wait(DISPLAY_TIME);

                    await nextPhoto();
                }

            } catch (error) {
                console.error(
                    "Slideshow initialization failed:",
                    error
                );
            }
        }

        loadPhotos();
    </script>

</body>
</html>
