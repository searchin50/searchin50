<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Search-In: The Road to 50</title> 

    <!-- Source Sans Pro Regular --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link 
        href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap" 
        rel="stylesheet" 
    > 

    <style> 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        } 

        html, body { 
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: #000; 
            font-family: "Source Sans Pro", sans-serif; 
        } 

        /* SLIDESHOW */ 

        .slideshow { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; /* Handles mobile dynamic viewport height */
            background: #000; 
            z-index: 1;
        } 

        .slide { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center center; 
            background-repeat: no-repeat; 
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            will-change: opacity;
        } 

        .slide.active { 
            opacity: 1; 
        } 

        /* DARK OVERLAY */ 

        .overlay { 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100vh; 
            height: 100dvh;
            padding: 24px; 
            background: rgba(0, 0, 0, 0.45); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            z-index: 2;
        } 

        /* SEARCH-IN LOGO */ 

        .logo { 
            width: 100px; 
            max-width: 80%; 
            margin-bottom: 20px; 
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6)); 
        } 

        /* MAIN TITLE */ 

        .title { 
            color: #ffffff; 
            font-size: 4rem; 
            font-weight: 600; 
            letter-spacing: 8px; 
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7); 
        } 

        /* MINIMALIST COUNTDOWN */ 

        .countdown { 
            display: flex; 
            gap: 24px; 
            margin-top: 20px; 
            color: #ffffff; 
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7); 
        } 

        .countdown-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 50px;
        } 

        .countdown-number { 
            font-size: 2.2rem; 
            font-weight: 600; 
            letter-spacing: 2px; 
            line-height: 1; 
        } 

        .countdown-label { 
            font-size: 0.75rem; 
            font-weight: 400; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            opacity: 0.85; 
            margin-top: 6px; 
        } 

        /* SOCIAL MEDIA BUTTONS */ 

        .social-links { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 16px; 
            margin-top: 70px; 
        } 

        .social-button { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 44px; 
            height: 44px; 
            color: #ffffff; 
            background: rgba(255, 255, 255, 0.12); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 50%; 
            text-decoration: none; 
            transition: 
                background 0.25s ease, 
                color 0.25s ease, 
                transform 0.25s ease, 
                border-color 0.25s ease; 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        } 

        .social-button svg { 
            width: 21px; 
            height: 21px; 
            fill: currentColor; 
        } 

        .social-button:hover, 
        .social-button:focus-visible { 
            color: #111; 
            background: #ffffff; 
            border-color: #ffffff; 
            transform: translateY(-3px); 
            outline: none; 
        } 

        .social-button:focus-visible { 
            outline: 2px solid white; 
            outline-offset: 4px; 
        } 

        /* MOBILE OPTIMIZATIONS */ 

        @media (max-width: 768px) { 
            .overlay { 
                padding: 16px; 
            } 

            .logo { 
                width: 75px; 
                margin-bottom: 16px; 
            } 

            .title { 
                font-size: clamp(1.6rem, 6.5vw, 2.5rem); 
                letter-spacing: 3px; 
            } 

            .countdown { 
                gap: 12px; 
                margin-top: 16px; 
            } 

            .countdown-item {
                min-width: 40px;
            }

            .countdown-number { 
                font-size: 1.4rem; 
            } 

            .countdown-label { 
                font-size: 0.6rem; 
                letter-spacing: 1px; 
            } 

            .social-links { 
                gap: 14px; 
                margin-top: 40px; 
            } 

            .social-button { 
                width: 42px; 
                height: 42px; 
            } 

            .social-button svg { 
                width: 20px; 
                height: 20px; 
            } 
        } 

        @media (prefers-reduced-motion: reduce) { 
            .slide, 
            .social-button { 
                transition: none; 
            } 
        } 
    </style> 
</head> 

<body> 

    <!-- PHOTO SLIDESHOW --> 
    <div class="slideshow" id="slideshow"> 
        <div class="slide" id="slideA"></div> 
        <div class="slide" id="slideB"></div> 
    </div> 

    <!-- CENTER CONTENT --> 
    <main class="overlay"> 

        <img 
            class="logo" 
            src="logo.png" 
            alt="Search-In Logo" 
            onerror="this.style.display='none'"
        > 

        <div class="title">THE ROAD TO 50</div> 

        <!-- MINIMALIST COUNTDOWN TO JULY 29, 2028 --> 
        <div class="countdown" id="countdown" aria-live="polite"> 
            <div class="countdown-item"> 
                <span class="countdown-number" id="days">00</span> 
                <span class="countdown-label">Days</span> 
            </div> 
            <div class="countdown-item"> 
                <span class="countdown-number" id="hours">00</span> 
                <span class="countdown-label">Hours</span> 
            </div> 
            <div class="countdown-item"> 
                <span class="countdown-number" id="minutes">00</span> 
                <span class="countdown-label">Mins</span> 
            </div> 
            <div class="countdown-item"> 
                <span class="countdown-number" id="seconds">00</span> 
                <span class="countdown-label">Secs</span> 
            </div> 
        </div> 

        <!-- SOCIAL MEDIA LINKS --> 
        <nav class="social-links" aria-label="Search-In social media"> 

            <!-- FACEBOOK --> 
            <a 
                class="social-button" 
                href="https://www.facebook.com/LSGHSearchIn" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Visit Search-In on Facebook" 
                title="Facebook" 
            > 
                <svg viewBox="0 0 24 24" aria-hidden="true"> 
                    <path d="M13.4 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.2v3.2H10V21h3.4z"/> 
                </svg> 
            </a> 

            <!-- INSTAGRAM --> 
            <a 
                class="social-button" 
                href="https://www.instagram.com/searchinlsgh" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Visit Search-In on Instagram" 
                title="Instagram" 
            > 
                <svg viewBox="0 0 24 24" aria-hidden="true"> 
                    <rect 
                        x="3" 
                        y="3" 
                        width="18" 
                        height="18" 
                        rx="5" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                    /> 
                    <circle 
                        cx="12" 
                        cy="12" 
                        r="4" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                    /> 
                    <circle cx="17.5" cy="6.8" r="1.2"/> 
                </svg> 
            </a> 

            <!-- X --> 
            <a 
                class="social-button" 
                href="https://x.com/searchinlsgh" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Visit Search-In on X" 
                title="X" 
            > 
                <svg viewBox="0 0 24 24" aria-hidden="true"> 
                    <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 13.9 4.9 22H1.8l7.3-8.4L1.3 2h6.4l4.5 7.5L18.9 2zm-1.1 18h1.7L6.8 3.9H5L17.8 20z"/> 
                </svg> 
            </a> 

            <!-- SPOTIFY --> 
            <a 
                class="social-button" 
                href="https://open.spotify.com/playlist/7uftqd0JLpVEjTf4bv41o9?si=83c557d81d8141dc" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Listen to the Search-In playlist on Spotify" 
                title="Spotify" 
            > 
                <svg viewBox="0 0 24 24" aria-hidden="true"> 
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.5a.8.8 0 0 1-1.1.3c-2.8-1.7-6.3-2.1-10.4-1.1a.8.8 0 1 1-.4-1.5c4.5-1 8.4-.6 11.6 1.3.4.2.5.7.3 1zm1.5-3.2a1 1 0 0 1-1.3.3c-3.2-2-8-2.6-11.7-1.4a1 1 0 1 1-.6-1.8c4.3-1.3 9.6-.7 13.3 1.6.5.3.6.9.3 1.3zm.1-3.3c-3.8-2.3-10-2.5-13.6-1.4a1.1 1.1 0 0 1-.7-2.1c4.2-1.3 11-1.1 15.4 1.6a1.1 1.1 0 0 1-1.1 1.9z"/> 
                </svg> 
            </a> 

        </nav> 
    </main> 

    <script> 
        /* COUNTDOWN LOGIC TARGETING JULY 29, 2028 */
        const targetDate = new Date("2028-07-29T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = 
                    "<span class=\"countdown-number\">WELCOME TO THE 50TH</span>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        /* SLIDESHOW LOGIC WITH MOBILE AND LOCAL EMBED FALLBACKS */
        const fallbackImages = [
            "https://picsum.photos/id/1015/1920/1080",
            "https://picsum.photos/id/1018/1920/1080",
            "https://picsum.photos/id/1025/1920/1080"
        ];

        async function loadPhotos() { 
            const slideA = document.getElementById("slideA"); 
            const slideB = document.getElementById("slideB"); 

            let imageURLs = [];

            try { 
                const hostname = window.location.hostname; 
                const pathname = window.location.pathname; 

                let owner = ""; 
                let repo = ""; 

                if (hostname.endsWith(".github.io")) { 
                    owner = hostname.replace(".github.io", ""); 

                    const pathParts = pathname 
                        .split("/") 
                        .filter(Boolean); 

                    repo = pathParts[0] || `${owner}.github.io`; 
                } 

                if (owner && repo) {
                    const apiURL = `https://api.github.com/repos/${owner}/${repo}/contents/images`; 
                    const response = await fetch(apiURL); 

                    if (response.ok) { 
                        const files = await response.json(); 

                        let githubFiles = files.filter(file => { 
                            const name = file.name.toLowerCase(); 
                            const isImage = /\.(jpg|jpeg|png|webp)$/i.test(name); 
                            const isLogo = /^logo\.(jpg|jpeg|png|webp)$/i.test(name); 

                            return file.type === "file" && isImage && !isLogo && file.download_url; 
                        }); 

                        imageURLs = githubFiles.map(f => f.download_url);
                    } 
                }
            } catch (error) { 
                console.warn("Could not query GitHub API, falling back to local or default images:", error); 
            } 

            // If GitHub API yields no photos (e.g. running outside GH Pages or rate-limited), fallback
            if (imageURLs.length === 0) {
                imageURLs = [...fallbackImages];
            }

            // Shuffle photo order
            for (let i = imageURLs.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [imageURLs[i], imageURLs[j]] = [imageURLs[j], imageURLs[i]]; 
            } 

            // Helper to preload image cleanly on both mobile safari & webview browsers
            function preloadImage(url) { 
                return new Promise(resolve => { 
                    const image = new Image(); 
                    let finished = false; 

                    function finish(success) { 
                        if (finished) return; 
                        finished = true; 
                        resolve(success ? url : null); 
                    } 

                    image.onload = async () => { 
                        try { 
                            if (image.decode) { 
                                await image.decode(); 
                            } 
                            finish(image.naturalWidth > 0); 
                        } catch { 
                            finish(image.naturalWidth > 0); 
                        } 
                    }; 

                    image.onerror = () => finish(false); 
                    image.src = url; 

                    if (image.complete && image.naturalWidth > 0) { 
                        finish(true); 
                    } 
                }); 
            } 

            function wait(ms) { 
                return new Promise(resolve => setTimeout(resolve, ms)); 
            } 

            let currentIndex = -1; 
            let firstURL = null; 

            for (let i = 0; i < imageURLs.length; i++) { 
                const url = await preloadImage(imageURLs[i]); 
                if (url) { 
                    currentIndex = i; 
                    firstURL = url; 
                    break; 
                } 
            } 

            if (!firstURL) return; 

            let currentLayer = slideA; 
            let nextLayer = slideB; 

            currentLayer.style.backgroundImage = `url("${firstURL}")`; 
            currentLayer.classList.add("active"); 

            async function showNextPhoto() { 
                await wait(4000); 

                let nextURL = null; 
                let attempts = 0; 

                while (attempts < imageURLs.length) { 
                    currentIndex = (currentIndex + 1) % imageURLs.length; 
                    attempts++; 

                    nextURL = await preloadImage(imageURLs[currentIndex]); 
                    if (nextURL) break; 
                } 

                if (!nextURL) { 
                    showNextPhoto(); 
                    return; 
                } 

                nextLayer.style.backgroundImage = `url("${nextURL}")`; 

                await new Promise(resolve => 
                    requestAnimationFrame(() => 
                        requestAnimationFrame(resolve) 
                    ) 
                ); 

                nextLayer.classList.add("active"); 
                await wait(2000); 

                currentLayer.classList.remove("active"); 

                const oldLayer = currentLayer; 
                currentLayer = nextLayer; 
                nextLayer = oldLayer; 

                showNextPhoto(); 
            } 

            showNextPhoto(); 
        } 

        window.addEventListener("DOMContentLoaded", loadPhotos);
    </script> 

</body> 
</html>
