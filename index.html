<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEARCH-IN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.slideshow{
    position:fixed;
    width:100%;
    height:100vh;
    top:0;
    left:0;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation:fade 20s infinite;
}

.slide:nth-child(1){
    background-image:url("images/photo1.jpg");
    animation-delay:0s;
}

.slide:nth-child(2){
    background-image:url("images/photo2.jpg");
    animation-delay:5s;
}

.slide:nth-child(3){
    background-image:url("images/photo3.jpg");
    animation-delay:10s;
}

.slide:nth-child(4){
    background-image:url("images/photo4.jpg");
    animation-delay:15s;
}

@keyframes fade{
    0%{opacity:0;}
    5%{opacity:1;}
    25%{opacity:1;}
    30%{opacity:0;}
    100%{opacity:0;}
}

.overlay{
    position:relative;
    z-index:10;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.logo{
    width:200px;
    margin-bottom:20px;
}

.title{
    color:white;
    font-size:4rem;
    font-weight:bold;
    letter-spacing:6px;
    text-shadow:0 0 20px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="slideshow">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
</div>

<div class="overlay">
    images/logo.png
    <div class="title">SEARCH-IN</div>
</div>

</body>
</html>
