<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEARCH-IN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Source Sans 3', sans-serif;
  overflow: hidden;
}

.slideshow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center center;
  opacity: 0;
  animation: fade 20s infinite;
}

.slide:nth-child(1) {
  background-image: url("images/photo1.jpg");
  animation-delay: 0s;
}

.slide:nth-child(2) {
  background-image: url("images/photo2.jpg");
  animation-delay: 5s;
}

.slide:nth-child(3) {
  background-image: url("images/photo3.jpg");
  animation-delay: 10s;
}

.slide:nth-child(4) {
  background-image: url("images/photo4.jpg");
  animation-delay: 15s;
}

@keyframes fade {
  0%,100% {
    opacity: 0;
  }
  5%,25% {
    opacity: 1;
  }
  30% {
    opacity: 0;
  }
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.logo {
  width: 220px;
  max-width: 60vw;
  margin-bottom: 30px;
}

.title {
  color: white;
  font-size: 5rem;
  font-weight: 700;
  letter-spacing: 10px;
  text-shadow: 0 0 20px rgba(0,0,0,.5);
}

@media (max-width: 768px) {
  .title {
    font-size: 2.5rem;
  }

  .logo {
    width: 140px;
  }
}
</style>
</head>

<body>

<div class="slideshow">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<div class="overlay">
  images/logo.png
  <div class="title">SEARCH-IN</div>
</div>

</body>
</html>
